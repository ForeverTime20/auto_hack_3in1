name: Release

on:
  push:
    tags:
      - '*'

jobs:
  #  MSVC Build 
  msvc:
    name: MSVC (Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: msvc
          path: build/src/Release/auto_hack_3in1.exe

  #  MinGW Build 
  mingw:
    name: MinGW-w64 (Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mingw
          path: build/src/auto_hack_3in1.exe

  #  Release 
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [msvc, mingw]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Organize & tag-name artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          cp msvc/auto_hack_3in1.exe  "dist/auto_hack_3in1-${TAG}-msvc.exe"
          cp mingw/auto_hack_3in1.exe "dist/auto_hack_3in1-${TAG}-mingw.exe"
          sha256sum dist/*.exe > dist/checksums.txt
          ls -lh dist/

      # GitHub auto-generates AI-powered release notes.
      # We pre-pend the raw commit log for full transparency.
      - name: Prepare commit summary
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          RANGE="${PREV:+$PREV..}$TAG"

          {
            echo "##  Commits"
            echo
            git log "$RANGE" --no-merges --format='- %s'
            echo
          } > notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
